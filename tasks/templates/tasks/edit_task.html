{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Task - Student Task Manager</title>

    <link rel="stylesheet" href="{% static 'tasks/style.css' %}">
</head>

<body>

<header class="header">
    <div class="container header-content">
        <div>
            <div class="logo">Student Task Manager</div>
            <div class="header-subtitle">
                Update your academic task
            </div>
        </div>
    </div>
</header>


<main class="main">

    <div class="container">

        <div class="form-container">

            <h1>Edit Task</h1>

            <form method="POST">

                {% csrf_token %}


                <div class="form-group">

                    <label for="title">
                        Task Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        class="form-control"
                        value="{{ task.title }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        class="form-control"
                    >{{ task.description }}</textarea>

                </div>


                <div class="form-group">

                    <label for="priority">
                        Priority
                    </label>

                    <select
                        id="priority"
                        name="priority"
                        class="form-control"
                    >

                        <option
                            value="Low"
                            {% if task.priority == "Low" %}selected{% endif %}
                        >
                            Low
                        </option>

                        <option
                            value="Medium"
                            {% if task.priority == "Medium" %}selected{% endif %}
                        >
                            Medium
                        </option>

                        <option
                            value="High"
                            {% if task.priority == "High" %}selected{% endif %}
                        >
                            High
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="due_date">
                        Due Date
                    </label>

                    <input
                        type="date"
                        id="due_date"
                        name="due_date"
                        class="form-control"
                        value="{{ task.due_date|date:'Y-m-d' }}"
                    >

                </div>


                <div class="form-actions">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Update Task
                    </button>

                    <a
                        href="{% url 'home' %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</main>


<footer class="footer">
    Student Task Manager &copy; 2026
</footer>


</body>
</html>
