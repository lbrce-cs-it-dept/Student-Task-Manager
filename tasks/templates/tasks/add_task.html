{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Task - Student Task Manager</title>

    <link rel="stylesheet" href="{% static 'tasks/style.css' %}">
</head>

<body>

<header class="header">
    <div class="container header-content">
        <div>
            <div class="logo">Student Task Manager</div>
            <div class="header-subtitle">
                Add a new academic task
            </div>
        </div>
    </div>
</header>


<main class="main">

    <div class="container">

        <div class="form-container">

            <h1>Add New Task</h1>

            <form method="POST">

                {% csrf_token %}


                <div class="form-group">

                    <label for="title">
                        Task Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        class="form-control"
                        placeholder="Enter task title"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        class="form-control"
                        placeholder="Describe your task..."
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="priority">
                        Priority
                    </label>

                    <select
                        id="priority"
                        name="priority"
                        class="form-control"
                    >

                        <option value="Low">
                            Low
                        </option>

                        <option value="Medium" selected>
                            Medium
                        </option>

                        <option value="High">
                            High
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="due_date">
                        Due Date
                    </label>

                    <input
                        type="date"
                        id="due_date"
                        name="due_date"
                        class="form-control"
                    >

                </div>


                <div class="form-actions">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Add Task
                    </button>

                    <a
                        href="{% url 'home' %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</main>


<footer class="footer">
    Student Task Manager &copy; 2026
</footer>


</body>
</html>
